security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        # Провайдер для админов (например, сущность User)
        admin_provider:
            entity:
                class: App\Entity\User
                property: username

        # Провайдер для личного кабинета (например, сущность Customer)
        client_provider:
            entity:
                class: App\Entity\Customer
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        admin:
            pattern: ^/admin
            provider: admin_provider

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                always_remember_me: true

            login_throttling:
                max_attempts: 3
                interval: '15 minutes'

            # Здесь настраивается форма входа для админки
            form_login:
                enable_csrf: true
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin_default_index
            logout:
                path: admin_logout
                target: app_index

            switch_user: { role: ROLE_ADMIN, parameter: _switch_user }

        # ФАЙРВОЛ ДЛЯ ЛИЧНОГО КАБИНЕТА (Основа сайта)
        client:
            pattern: ^/profile
            provider: client_provider

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                always_remember_me: true

            login_throttling:
                max_attempts: 3
                interval: '15 minutes'

            form_login:
                enable_csrf: true
                login_path: profile_login
                check_path: profile_login
                default_target_path: profile_order_index
            logout:
                path: profile_logout
                target: app_index

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/admin/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }

        - { path: ^/profile/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/profile/login, roles: PUBLIC_ACCESS }
        - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: bcrypt
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon

            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: bcrypt
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
